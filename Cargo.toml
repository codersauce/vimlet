[package]
name = "vimlet"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A headless Vim editing engine for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/codersauce/vimlet"
homepage = "https://github.com/codersauce/vimlet"
documentation = "https://docs.rs/vimlet"
keywords = ["vim", "editor", "modal", "headless"]
categories = ["text-editors"]
include = ["src/**", "examples/**", "tests/**", "docs/**", "scripts/**", "assets/vimlet.png", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
ropey = ["dep:ropey"]

[dependencies]
unicode-segmentation = "1.12"
unicode-width = "0.2"
ropey = { version = "1.6.1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "rope"
required-features = ["ropey"]
